name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate Snake
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: BecaIanz

          outputs: |
            dist/github-contribution-grid-snake.gif?color_snake=#39D353&color_dots=#0D1117,#0E4429,#006D32,#26A641,#39D353&color_background=#0D1117
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#39D353&color_dots=#0D1117,#0E4429,#006D32,#26A641,#39D353

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update Snake animation"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
